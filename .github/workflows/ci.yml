name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Markdown lint
        run: npm run lint:md
      - name: Unit and local D1/R2 integration tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check
        run: python -m py_compile pi/worker.py
      - name: Install Pi test dependencies
        run: python -m pip install -r pi/requirements.txt
      - name: Pi behavioral tests
        run: python -m unittest discover -s pi -p "test_*.py" -v
